apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.154.0
    helm:
      values: |
        image:
          repository: otel/opentelemetry-collector-contrib
        mode: daemonset
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
            filelog:
              include:
                - /var/log/pods/*/*/*.log
              include_file_path: true
              operators:
                - type: container
                  id: container-parser
          processors:
            batch: {}
          exporters:
            otlphttp/loki:
              endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
            prometheus:
              endpoint: 0.0.0.0:8889
          service:
            pipelines:
              logs:
                receivers: [filelog]
                processors: [batch]
                exporters: [otlphttp/loki]
              metrics:
                receivers: [otlp]
                processors: [batch]
                exporters: [prometheus]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
