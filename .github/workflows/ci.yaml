name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '!app/chart/values.yaml'

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'Update image tag')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tamagotchi:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tamagotchi:latest

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/tamagotchi:${{ github.sha }}
          exit-code: '1'
          severity: CRITICAL

      - name: Update image tag
        run: |
          sed -i "s/tag:.*/tag: ${{ github.sha }}/" app/chart/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add app/chart/values.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push
